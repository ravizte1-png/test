name: Terraform

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/preprod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "c1948bcc-4779-41f2-9140-67d1201c6689" \
            --password "6a2b2bb5-5572-429a-bf22-94a48025a8f7" \
            --tenant "63266205-65be-40b5-84bb-5f9624dff5ab"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "bc9d2c5e-f99f-4142-8f22-8f6dae37180d"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    # Apply ONLY after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: environments/preprod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "c1948bcc-4779-41f2-9140-67d1201c6689" \
            --password "6a2b2bb5-5572-429a-bf22-94a48025a8f7" \
            --tenant "63266205-65be-40b5-84bb-5f9624dff5ab"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "bc9d2c5e-f99f-4142-8f22-8f6dae37180d"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
